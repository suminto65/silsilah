# Menjaga proyek Supabase (paket gratis) tetap aktif dengan satu permintaan ke database setiap hari.
name: Jaga Supabase tetap aktif

on:
  schedule:
    - cron: '17 3 * * *'   # tiap hari pukul 03:17 UTC (sekitar 10:17 WIB)
  workflow_dispatch:        # boleh dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kirim permintaan ke database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diisi."; exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/trees?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
          echo
          echo "Berhasil: database menerima permintaan."
